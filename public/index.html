<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b3121b">
<meta name="description" content="輸入地標，尋找附近巴士站與實時到站時間，覆蓋九巴及龍運、城巴及新巴">
<title>HK BusETA — 香港巴士到站時間</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- 圖示 -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
	<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
	<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
	<symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
	<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
	<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></symbol>
	<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
	<symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4L3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5zM9 4v13M15 6.5v13"/></symbol>
	<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
	<symbol id="i-bus" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="14" rx="2"/><path d="M4 10h16M8 17v3M16 17v3M8 14h1M15 14h1"/></symbol>
	<symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 8v5M12 16.5v.5"/><path d="M10.3 3.9L2.6 17.4A1.8 1.8 0 0 0 4.2 20h15.6a1.8 1.8 0 0 0 1.6-2.6L13.7 3.9a1.8 1.8 0 0 0-3.1 0z"/></symbol>
	<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
	<symbol id="i-off" viewBox="0 0 24 24"><path d="M12 8v4M8.5 13.5a5 5 0 0 1 7 0M5 10.5a10 10 0 0 1 4-2.4M19 10.5a10 10 0 0 0-3-2M2 2l20 20"/></symbol>
	<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
	<symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
	<symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H14a4 4 0 0 0 4-4v-5.5"/></symbol>
	<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
	<symbol id="i-chev-down" viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></symbol>
	<symbol id="i-wifi" viewBox="0 0 24 24"><path d="M4.5 9.8a11 11 0 0 1 15 0M7.6 13a6.5 6.5 0 0 1 8.8 0M10.7 16.2a2.8 2.8 0 0 1 2.6 0"/><circle cx="12" cy="18.8" r="1.1"/></symbol>
	<symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
</svg>

<div id="app">

	<!-- ① 搜尋頁 -->
	<section class="page active" id="page-search">
		<header class="topbar">
			<h1>HK Bus ETA<span class="sub" id="app-sub">香港巴士到站時間</span></h1>
			<div class="menu-wrap">
				<button class="icon-btn" id="menu-btn" aria-label="開啟選單" aria-expanded="false" aria-controls="menu-panel" title="選單">
					<svg><use href="#i-menu"/></svg>
				</button>
			</div>
			<!-- 漢堡選單：由頁尾搬入嘅項目（離線資料與版本號留喺頁尾）。
			     直接放喺 .topbar 之下 → 以 sticky topbar 做定位基準，top:100% 即底邊 -->
			<div class="menu-panel" id="menu-panel" hidden>
				<div class="menu-item">
					<svg class="mi-ico"><use href="#i-wifi"/></svg>
					<div class="mi-body">
						<div class="mi-title">網絡狀態</div>
						<div class="mi-desc"><span id="net-state"></span></div>
					</div>
				</div>
				<div class="menu-item">
					<svg class="mi-ico"><use href="#i-doc"/></svg>
					<div class="mi-body">
						<div class="mi-title">資料來源</div>
						<div class="mi-desc" id="data-attribution"></div>
					</div>
				</div>
				<button class="menu-item danger" id="clear-data">
					<svg class="mi-ico"><use href="#i-trash"/></svg>
					<div class="mi-body">
						<div class="mi-title">清除本機所有資料</div>
						<div class="mi-desc">搜尋記錄、常搭路線、常到車站與地標緩存，全部只存於此裝置</div>
					</div>
				</button>
			</div>
		</header>


		<div class="search-box">
			<div class="search-field" id="search-field">
				<svg><use href="#i-search"/></svg>
				<input type="search" id="q" placeholder="輸入大廈、商場、機場…" autocomplete="off"
					enterkeyhint="search" autocorrect="off" autocapitalize="off" spellcheck="false">
				<button class="clear" id="q-clear" aria-label="清除">
					<svg><use href="#i-x"/></svg>
				</button>
			</div>
		</div>

		<div id="search-status"></div>
		<div id="search-results"></div>
		<div id="recent"></div>

		<div class="foot">
			<div id="data-stamp"></div>
			<!-- 版本號：讓用戶一眼分辨新版／舊版（單一真相來源 = manifest.json 的 version） -->
			<div id="app-version" class="ver"></div>
		</div>
	</section>

	<!-- ② 附近站列表 -->
	<section class="page" id="page-nearby">
		<header class="topbar">
			<button class="icon-btn" id="nb-back" aria-label="返回">
				<svg><use href="#i-back"/></svg>
			</button>
			<h1>附近巴士站<span class="sub" id="nb-sub"></span></h1>
			<button class="icon-btn" id="nb-map" aria-label="顯示地圖" title="顯示地圖">
				<svg><use href="#i-map"/></svg>
			</button>
		</header>

		<div class="place-bar">
			<svg><use href="#i-pin"/></svg>
			<span class="nm" id="nb-place"></span>
		</div>

		<div class="range-bar">
			<div class="range-seg" id="range-seg">
				<button data-r="100">100米</button>
				<button data-r="200" class="on">200米</button>
				<button data-r="500">500米</button>
			</div>
			<button class="map-btn" id="nb-map2">
				<svg><use href="#i-map"/></svg><span>地圖</span>
			</button>
		</div>

		<div class="section-title" id="nb-count"></div>
		<div id="nb-list"></div>
	</section>

	<!-- ③ 站點 ETA -->
	<section class="page" id="page-eta">
		<header class="topbar">
			<button class="icon-btn" id="eta-back" aria-label="返回">
				<svg><use href="#i-back"/></svg>
			</button>
			<h1>到站時間<span class="sub" id="eta-sub"></span></h1>
			<button class="icon-btn" id="eta-refresh" aria-label="立即更新">
				<svg><use href="#i-refresh"/></svg>
			</button>
		</header>

		<div class="stop-hero">
			<div class="nm" id="eta-name"></div>
			<button class="map-link" id="eta-map" aria-label="顯示附近 200 米地圖" title="顯示附近 200 米地圖">
				<svg><use href="#i-map"/></svg>
				<span class="t" id="eta-map-label">附近 200 米地圖</span>
			</button>
			<button class="star" id="eta-fav" aria-label="加入常到車站" title="加入常到車站">
				<svg><use href="#i-star"/></svg>
			</button>
		</div>

		<div class="section-title">
			<span id="eta-status">每 15 秒更新</span>
			<span class="count" id="eta-stamp"></span>
		</div>
		<div id="eta-list"></div>
	</section>

	<!-- ④ 路線詳情（站序 + 選中站 ETA） -->
	<section class="page" id="page-route">
		<header class="topbar">
			<button class="icon-btn" id="rt-back" aria-label="返回">
				<svg><use href="#i-back"/></svg>
			</button>
			<h1>路線詳情<span class="sub" id="rt-sub"></span></h1>
			<button class="star" id="rt-fav" aria-label="加入常搭路線" title="加入常搭路線">
				<svg><use href="#i-star"/></svg>
			</button>
		</header>

		<div class="route-hero">
			<div class="no" id="rt-no"></div>
			<div class="meta">
				<span id="rt-dest"></span>
				<span class="svc-tag" id="rt-svc" hidden></span>
				<span class="ct" id="rt-count"></span>
			</div>
		</div>

		<!-- 方向分頁：零網絡請求（離線站序已含 O/I 兩方向） -->
		<div class="range-bar" style="padding-top:10px">
			<div class="dir-tabs" id="rt-dirs"></div>
			<button class="icon-btn" id="rt-refresh" aria-label="立即更新" title="立即更新" style="margin-left:8px">
				<svg><use href="#i-refresh"/></svg>
			</button>
		</div>

		<div class="seq-hint" id="rt-hint" hidden></div>

		<div class="section-title">
			<span id="rt-status"></span>
			<span class="count" id="rt-stamp"></span>
		</div>

		<div class="seq-list" id="rt-list"></div>
	</section>
</div>

<!-- 地圖 -->
<div id="map">
	<button class="map-close" id="map-close" aria-label="關閉地圖">
		<svg><use href="#i-x"/></svg>
	</button>
	<div class="offline-badge" id="map-offline">離線模式：無底圖（站點位置仍準確）</div>
</div>

<div class="toast" id="toast"></div>

<script src="vendor/leaflet.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
